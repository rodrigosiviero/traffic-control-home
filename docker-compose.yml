services:
  traffic-monitor:
    build: .
    container_name: traffic-monitor
    restart: unless-stopped
    
    # Acessar câmera RTSP na rede local
    network_mode: host
    
    # Intel GPU (i5-12400 UHD 730) — OpenVINO usa pra inferência
    devices:
      - /dev/dri:/dev/dri
    
    volumes:
      # Config
      - ./config.yaml:/app/config.yaml:ro
      
      # Dados persistentes
      - ./data:/data
    
    environment:
      - TZ=America/Sao_Paulo
    
    ports:
      - "8090:8090"
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
